<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

                <h3 class="text-center mt-3">Assistant Dashboard</h3>

    <div class="container mt-4 d-flex justify-content-end">

        <a class="btn btn-outline-secondary" href="{{ url_for('upload_documents') }}">
            Upload →
        </a>
    </div>

    <div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">



        <div class="card shadow-lg p-0" style="width: 600px; border-radius: 15px;">

            <div id="chat-box" class="card-body bg-white" style="height:70vh;overflow-y: scroll; padding: 20px;">

            </div>

            <div class="card-footer bg-white">
                <div class="input-group">
                    <input id="user-input" class="form-control" placeholder="Type a message..." type="text" />
                    <button class="btn btn-primary" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>


    <script>

        async function sendMessage() {

            const inputbox = document.getElementById('user-input');
            const sendBtn = document.getElementById("send-btn");

            const userMsg = inputbox.value.trim();
            console.log('userMsg', userMsg);


            if (userMsg === "") {
                return
            }

            addMessage(userMsg, "user");
            inputbox.value = "";

            try {
                const response = await axios.post('/query', {
                    "question": userMsg
                },
                    {
                        headers: {
                            'Content-Type': "application/json",
                        },
                    });


                const data = response.data['answer'];
                console.log('data', data);
                addMessage(data, "bot");
            }
            catch (err) {
                console.log(err);
                addMessage("Error connectiing to server", bot)
            }
        }

        function addMessage(message, sender) {

            const chatBox = document.getElementById("chat-box");

            const msgDiv = document.createElement("div");
            msgDiv.classList.add("mb-3");
            if (sender === "user") {
                msgDiv.classList.add("text-end");
                msgDiv.innerHTML = `<span class="badge bg-primary">${message}</span>`;

            }
            else {
                msgDiv.classList.add("text-start");
                msgDiv.innerHTML = `<span class="badge bg-secondary">${message}</span>`;

            }
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }




    </script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="/static/js/chat.js"></script>
</body>

</html>
